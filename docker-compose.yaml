services:
  container:
    build: .
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./:/app
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
