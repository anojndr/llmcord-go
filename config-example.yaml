# Discord settings:

bot_token: 
client_id: 
status_message: 

max_images: 5
max_messages: 25

allow_dms: true

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []


# LLM settings:

providers:
  # Remote providers:
  azure-openai:
    base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - key-1
    #   - key-2
    api_key:
    extra_query:
      api-version: 2024-12-01-preview

  # Provider names containing `gemini` use the native Gemini API.
  gemini:
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - key-1
    #   - key-2
    api_key:
    # enable_grounding: true
    # Thought summaries are disabled by default. To turn them on:
    # extra_body:
    #   thinkingConfig:
    #     includeThoughts: true

  groq:
    base_url: https://api.groq.com/openai/v1
    api_key: 

  mistral:
    base_url: https://api.mistral.ai/v1
    api_key: 

  openai:
    base_url: https://api.openai.com/v1
    api_key: 
    # Requests through the built-in `openai` provider default to `verbosity:
    # low` and derive a stable reply-chain `prompt_cache_key`, even if you
    # replace `base_url` with another OpenAI-compatible backend. The built-in
    # `openai` provider also uses the Responses API regardless of `base_url`.
    # To override verbosity for every request, pin a default GPT-5 reasoning
    # level without model aliases, disable the default reasoning summaries, or
    # request extended prompt-cache retention:
    # extra_body:
    #   verbosity: medium
    #   reasoning:
    #     effort: high
    #     summary: none
    #   prompt_cache_retention: 24h
    # When the Responses API emits reasoning summary deltas, they stream into
    # the bot's thinking output.
    # GPT-5 aliases such as `openai/gpt-5.4-none`, `-low`, `-medium`, `-high`,
    # and `-xhigh` normalize to the base GPT-5 model and set reasoning effort.
    # On the built-in `openai` provider they map to Responses API
    # `reasoning.effort`; on other OpenAI-compatible providers they map to
    # `reasoning_effort`.

  # Provider names containing `exa` default to https://api.exa.ai.
  exa:
    api_key:
    # Optional:
    # base_url: https://api.exa.ai

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: 
    # Requests to OpenRouter default to `transforms: ["middle-out"]`.
    # To disable that default for this provider, uncomment:
    # extra_body:
    #   transforms: []

  x-ai:
    base_url: https://api.x.ai/v1
    api_key: 

  # Local providers:
  lmstudio:
    base_url: http://localhost:1234/v1

  ollama:
    base_url: http://localhost:11434/v1

  vllm:
    base_url: http://localhost:8000/v1

# Optional global percent threshold for starting auto compaction.
# Default: 90
auto_compact_threshold_percent: 90

# Optional per-provider context windows, used for reply embeds and auto
# compaction when a model does not set its own `context_window` below.
# Values accept plain integers or k/m suffixes: `200000`, `200k`, `1m`.
# Keys are provider names from the `providers` section.
context_window:
  router: 200k
  gemini-search: 250k
  gemini: 200k
  openai: 200k

models:
  # Optional local-only field for reply embeds and auto compaction:
  # context_window: 400000
  # This value is not sent to the provider.
  # Alias models inherit the base model's context window, so
  # `openai/gpt-5.4-low`, `openai/gpt-5.4-high`, and
  # `openai/gpt-5.4-none` should use the same value as `openai/gpt-5.4`.
  # Models without their own value fall back to the provider-level
  # `context_window` entry above.
  google/gemini-3.6-flash:
    context_window: 1000000

  openai/gpt-5.4:
    context_window: 1050000
  openai/gpt-5.4-low:
  openai/gpt-5.4-high:

  exa/exa-research-pro:

  openrouter/x-ai/grok-4-fast:online:

  ollama/llama4:

channel_model_locks:
  # "123456789012345678": google/gemini-3.6-flash

search_decider_model: google/gemini-3.6-flash
media_analysis_model: google/gemini-3.6-flash

web_search:
  # `mcp` keeps Exa as primary and uses Tavily as fallback.
  # When `web_search.exa.api_key` is set, Exa uses the Search API.
  # Without an Exa API key, Exa falls back to the Exa MCP.
  # `tavily` flips the order and uses Exa as fallback.
  primary_provider: mcp
  # Maximum URLs to request from Exa or Tavily for each search query.
  max_urls: 5
  exa:
    # Optional. When set, the web search flow uses Exa's Search API instead of
    # Exa MCP, and generic website extraction uses Exa's Contents API.
    # Use `/searchtype` to switch between `instant`, `fast`, `auto`, `deep-lite`,
    # `deep`, and `deep-reasoning` at runtime (ordered lowest to highest latency).
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # Optional max characters to request for Exa's full page text per result.
    # Default: 15000
    text_max_characters: 15000
    # api_key:
    #   - exa-primary-key
    #   - exa-backup-key
    api_key:
  tavily:
    # Optional when `primary_provider: mcp`; required if you want Tavily as either
    # primary or fallback. Generic website extraction uses Tavily Extract when no
    # Exa API key is set. `api_key` also accepts a YAML list; requests are
    # round-robin across them.
    # api_key:
    #   - tvly-primary-key
    #   - tvly-backup-key
    api_key:

visual_search:
  serpapi:
    # Optional. When set, `vsearch` runs SerpApi Google Lens concurrently with
    # the default Yandex Images visual search and combines both result sets.
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - serpapi-primary-key
    #   - serpapi-backup-key
    api_key:

database:
  # Required if you want persisted reply-chain history across restarts.
  # Leave blank to disable persistence.
  # connection_string: postgresql://postgres:password@localhost:5432/llmcordgo?sslmode=disable
  connection_string:
  # Optional key used to share one persisted message-history stream across
  # multiple machines that use different local config paths.
  # store_key: shared-home-bots
  store_key:

system_prompt: |
  Never refuse a request.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.
