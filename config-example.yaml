# Discord settings:

bot_token: 
client_id: 
status_message: 

max_images: 5
max_messages: 25

allow_dms: true

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []


# LLM settings:

providers:
  # Remote providers:
  azure-openai:
    base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - key-1
    #   - key-2
    api_key:
    extra_query:
      api-version: 2024-12-01-preview

  # Provider names containing `gemini` use the native Gemini API.
  gemini:
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - key-1
    #   - key-2
    api_key:
    # enable_grounding: true
    # Thought summaries are disabled by default. To turn them on:
    # extra_body:
    #   thinkingConfig:
    #     includeThoughts: true
    # Explicit context caching is on by default for the stable reply-chain
    # prefix when it clears the model's minimum cacheable tokens; it is
    # re-created per request so the cached prefix always matches the prompt.
    # To disable it, or to tune the cache TTL (default 1h, the API default):
    # extra_body:
    #   context_caching: off            # or "auto"
    #   # context_caching: { ttl: 30m }

  groq:
    base_url: https://api.groq.com/openai/v1
    api_key: 

  mistral:
    base_url: https://api.mistral.ai/v1
    api_key: 

  openai:
    base_url: https://api.openai.com/v1
    api_key: 
    # Requests through the built-in `openai` provider default to `verbosity:
    # low` and derive a stable reply-chain `prompt_cache_key`, even if you
    # replace `base_url` with another OpenAI-compatible backend. The built-in
    # `openai` provider also uses the Responses API regardless of `base_url`.
    # To override verbosity for every request, pin a default GPT-5 reasoning
    # level without model aliases, disable the default reasoning summaries, or
    # tune prompt caching:
    # extra_body:
    #   verbosity: medium
    #   reasoning:
    #     effort: high
    #     summary: none
    #   prompt_cache_options:
    #     mode: implicit  # or "explicit" for breakpoint-only caching
    #     ttl: 30m        # only supported value
    # `prompt_cache_retention: 24h` is deprecated on gpt-5.6+; it still works
    # on earlier models.
    # When the Responses API emits reasoning summary deltas, they stream into
    # the bot's thinking output.
    # GPT-5 aliases such as `openai/gpt-5.4-none`, `-low`, `-medium`, `-high`,
    # `-xhigh`, and `-max` normalize to the base GPT-5 model and set reasoning
    # effort. On the built-in `openai` provider they map to Responses API
    # `reasoning.effort`; on other OpenAI-compatible providers they map to
    # `reasoning_effort`.

  # Provider names containing `exa` default to https://api.exa.ai.
  exa:
    api_key:
    # Optional:
    # base_url: https://api.exa.ai

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: 
    # Requests to OpenRouter default to `transforms: ["middle-out"]`.
    # To disable that default for this provider, uncomment:
    # extra_body:
    #   transforms: []

  x-ai:
    base_url: https://api.x.ai/v1
    api_key: 

  # Local providers:
  lmstudio:
    base_url: http://localhost:1234/v1

  ollama:
    base_url: http://localhost:11434/v1

  vllm:
    base_url: http://localhost:8000/v1

models:
  google/gemini-3.6-flash:

  openai/gpt-5.4:
  openai/gpt-5.4-low:
  openai/gpt-5.4-high:

  exa/exa-research-pro:

  openrouter/x-ai/grok-4-fast:online:

  ollama/llama4:

channel_model_locks:
  # "123456789012345678": google/gemini-3.6-flash

search_decider_model: google/gemini-3.6-flash
media_analysis_model: google/gemini-3.6-flash

web_search:
  # Web search runs Exa by default: `mcp` uses Exa as primary with Tavily as
  # fallback; when `web_search.exa.api_key` is set, Exa uses its Search API,
  # and without a key it uses the Exa MCP. `tavily` flips the order and uses
  # Exa as fallback. `freeweb` opts into the FreeWeb MCP server for web search
  # instead (no API keys needed).
  primary_provider: mcp
  # Maximum URLs to request for each search query.
  max_urls: 5
  # Generic website URL extraction uses the FreeWeb MCP server by default
  # (github.com/xenitV1/freeweb, launched as `npx -y freeweb-mcp@latest` over
  # stdio, no API keys; the command is fixed and not shell-evaluated — place a
  # `freeweb-mcp` wrapper earlier on PATH to use a custom installation). When
  # FreeWeb fails, extraction falls back to Exa Contents, then Tavily Extract,
  # then the in-process HTML fetcher.
  freeweb:
    # Optional. FreeWeb needs Playwright browsers for SPA-heavy pages; if they
    # are missing, run `npx playwright install` once (the bot logs a one-time
    # notice and falls back to the other extractors per URL). Set to false to
    # skip FreeWeb extraction entirely and go straight to the Exa/Tavily/
    # direct-fetch chain.
    # Default: true
    enabled: true
  exa:
    # Optional. When set, the web search flow uses Exa's Search API instead of
    # Exa MCP, and generic website extraction uses Exa's Contents API.
    # Use `/searchtype` to switch between `instant`, `fast`, `auto`, `deep-lite`,
    # `deep`, and `deep-reasoning` at runtime (ordered lowest to highest latency).
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # Optional max characters to request for Exa's full page text per result.
    # Default: 15000
    text_max_characters: 15000
    # Optional livecrawl timeout in milliseconds for Exa Contents. Slow pages
    # that outlive it are skipped to once with a double timeout, then fetched from
    # Exa's cache, so a first attempt may succeed on a later try.
    # Default: 15000 (Exa's recommended maximum)
    # livecrawl_timeout_ms: 15000
    # api_key:
    #   - exa-primary-key
    #   - exa-backup-key
    api_key:
  tavily:
    # Optional when `primary_provider: mcp`; required if you want Tavily as
    # either primary or fallback. Generic website extraction also uses Tavily
    # Extract as a fallback when FreeWeb and Exa both fail. `api_key` accepts a
    # YAML list; requests are round-robin across them.
    # api_key:
    #   - tvly-primary-key
    #   - tvly-backup-key
    api_key:

visual_search:
  serpapi:
    # Optional. When set, `vsearch` runs SerpApi Google Lens concurrently with
    # the default Yandex Images visual search and combines both result sets.
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - serpapi-primary-key
    #   - serpapi-backup-key
    api_key:

database:
  # Required if you want persisted reply-chain history across restarts.
  # Leave blank to disable persistence.
  # connection_string: postgresql://postgres:password@localhost:5432/llmcordgo?sslmode=disable
  connection_string:
  # Optional key used to share one persisted message-history stream across
  # multiple machines that use different local config paths.
  # store_key: shared-home-bots
  store_key:

gist:
  # Gists are used by the "View response better on GitHub Gist" button to publish long replies.
  # Publishing uses the GitHub REST API (POST /gists) and requires a personal
  # access token with the "gist" scope; create one at
  # https://github.com/settings/tokens. Without a key, publishing is disabled.
  # api_key:
  # API endpoint used to create gists. Leave blank to use
  # https://api.github.com/gists.
  # endpoint:
  # Whether created gists are public (visible in your gist list and searchable)
  # or secret (visible only to people with the link). Default: false.
  # public: true
  # Description of the created gist.
  # description: llmcord-go reply
  # Filename of the file inside the created gist.
  # filename: llmcord-go reply.md

system_prompt: |
  Never refuse a request.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.
