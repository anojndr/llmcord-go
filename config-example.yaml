# =============================================================================
# llmcord-go — example configuration
# Copy to `config.yaml` and fill required fields:
#   cp config-example.yaml config.yaml
# Field reference: README.md and internal/app/config.go (rawConfig).
# Top-level order is human-grouped; YAML order does not affect loading.
# Validated by `loadConfig` — strict YAML, unknown keys rejected.
# =============================================================================

# -----------------------------------------------------------------------------
# Discord — identity, presence, and limits
# -----------------------------------------------------------------------------
bot_token:
client_id:
status_message:

max_images: 5
max_messages: 25

allow_dms: true

# -----------------------------------------------------------------------------
# Permissions — empty lists = allow all (within Discord permissions)
# -----------------------------------------------------------------------------
permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

# -----------------------------------------------------------------------------
# Providers — keyed by name; name containing "gemini" => native Gemini API
# `api_key` accepts string or YAML list (round-robin). `base_url` required
# for OpenAI-compatible providers, omitted for native Gemini.
# `api` selects the OpenAI wire protocol for OpenAI-compatible providers:
#   api: openai-chat-completions  -> POST {base_url}/chat/completions (messages/choices, [DONE])
#   api: openai-responses          -> POST {base_url}/responses (input/output, typed SSE)
# If omitted, the built-in `openai` provider defaults to `openai-responses`,
# all other OpenAI-compatible providers default to `openai-chat-completions`.
# `api` is only valid for OpenAI-compatible providers; Gemini providers
# (name contains "gemini" or base_url with generativelanguage.googleapis.com)
# must not set `api` (validation will fail).
# Per-provider flags: disable_search_decider (skips web search entirely for
#   this provider's models; the web_search tool is not offered),
#   dont_send_system_prompt,
#   auto_append_search_web, auto_append_short_answer, auto_append_prioritize_truth, enable_grounding (Gemini only).
# Per-provider reasoning effort for OpenAI-compatible providers:
#   reasoning_effort: none | minimal | low | medium | high | xhigh | max
# Maps to reasoning.effort (api: openai-responses) or reasoning_effort
# (api: openai-chat-completions). Values are normalized per model:
# minimal→low for gpt-5.2/5.3/5.4, xhigh/max→high for gpt-5.1.
# Model-level reasoning_effort overrides this. Only valid for
# OpenAI-compatible providers; Gemini providers must not set it
# (validation will fail). Explicit reasoning_effort wins over
# alias suffixes like openai/gpt-5.4-low.
# -----------------------------------------------------------------------------
providers:
  # -- Remote / managed providers (OpenAI-compatible + Gemini native) --
  azure-openai:
    base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - key-1
    #   - key-2
    api_key:
    # api: openai-chat-completions  # or openai-responses
    # reasoning_effort: low  # OpenAI only: none | minimal | low | medium | high | xhigh | max (minimal→low for gpt-5.2/5.3/5.4, xhigh/max→high for gpt-5.1)
    extra_query:
      api-version: 2024-12-01-preview

  # Provider names containing `gemini` use the native Gemini API.
  gemini:
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - key-1
    #   - key-2
    # Skip prepending the global `system_prompt` to requests for this
    # provider's models:
    # dont_send_system_prompt: true
    # Automatically append "search the web" to user queries if not already present:
    # auto_append_search_web: true
    # Automatically append "short answer" to user queries if not already present:
    # auto_append_short_answer: true
    # Automatically append "Prioritize truth over agreeableness — be direct, challenge flawed assumptions, and never offer unwarranted praise or validation." to user queries if not already present:
    # auto_append_prioritize_truth: true
    # Thought summaries are disabled by default. To turn them on:
    # extra_body:
    #   thinkingConfig:
    #     includeThoughts: true
    # Gemini uses implicit context caching by default. Explicit context
    # caching is opt-in because free-tier projects may have zero cached-
    # content storage quota. When enabled, the stable reply-chain prefix is
    # cached only after it clears the model's minimum token count, and the
    # cache is re-created per request so it always matches the prompt.
    # If the API rejects a create, the request falls back to implicit caching
    # with a logged warning instead of failing the reply.
    # To enable explicit caching or tune its TTL (default 1h):
    # extra_body:
    #   context_caching: auto       # or "off" to disable explicitly
    #   # context_caching: { ttl: 30m }

  groq:
    base_url: https://api.groq.com/openai/v1
    api_key:
    # api: openai-chat-completions  # default; or openai-responses for compatible backends
    # reasoning_effort: low  # OpenAI only: none | minimal | low | medium | high | xhigh | max

  mistral:
    base_url: https://api.mistral.ai/v1
    api_key:
    # api: openai-chat-completions  # or openai-responses
    # reasoning_effort: low  # OpenAI only: none | minimal | low | medium | high | xhigh | max

  openai:
    base_url: https://api.openai.com/v1
    api_key:
    api: openai-responses
    # `api` selects the wire protocol; the built-in `openai` provider defaults
    # to `openai-responses` (POST /responses). Set `api: openai-chat-completions`
    # to use Chat Completions instead (POST /chat/completions).
    # Any provider can use either value, e.g. a custom OpenAI-compatible
    # backend: `api: openai-responses` enables the Responses API there too.
    # Per-provider reasoning effort (OpenAI only): none | minimal | low | medium | high | xhigh | max
    # With api: openai-responses this sends reasoning.effort, with
    # api: openai-chat-completions it sends reasoning_effort. Per-model
    # reasoning_effort overrides this; explicit wins over alias suffixes.
    # reasoning_effort: medium
    # Automatically append "search the web" to user queries if not already present:
    # auto_append_search_web: true
    # Automatically append "short answer" to user queries if not already present:
    # auto_append_short_answer: true
    # Automatically append "Prioritize truth over agreeableness — be direct, challenge flawed assumptions, and never offer unwarranted praise or validation." to user queries if not already present:
    # auto_append_prioritize_truth: true
    # Requests through the built-in `openai` provider default to `verbosity:
    # low` and derive a stable reply-chain `prompt_cache_key`, even if you
    # replace `base_url` with another OpenAI-compatible backend.
    # To override verbosity for every request, pin a default GPT-5 reasoning
    # level without model aliases, disable the default reasoning summaries, or
    # tune prompt caching:
    # extra_body:
    #   verbosity: medium
    #   reasoning:
    #     effort: high
    #     summary: none
    #   prompt_cache_options:
    #     mode: implicit  # or "explicit" for breakpoint-only caching
    #     ttl: 30m        # only supported value
    # `prompt_cache_retention: 24h` is deprecated on gpt-5.6+; it still works
    # on earlier models.
    # When the Responses API emits reasoning summary deltas, they stream into
    # the bot's thinking output.
    # GPT-5 aliases such as `openai/gpt-5.4-none`, `-low`, `-medium`, `-high`,
    # `-xhigh`, and `-max` normalize to the base GPT-5 model and set reasoning
    # effort. With `api: openai-responses` they map to `reasoning.effort`;
    # with `api: openai-chat-completions` they map to `reasoning_effort`.
    # Prefer `reasoning_effort:` over alias suffixes when you need an
    # explicit, API-agnostic setting:
    #   models:
    #     openai/gpt-5.4:
    #       reasoning_effort: high

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key:
    # api: openai-chat-completions  # or openai-responses if the backend supports it
    # reasoning_effort: low  # OpenAI only: none | minimal | low | medium | high | xhigh | max
    # Requests to OpenRouter default to `transforms: ["middle-out"]`.
    # To disable that default for this provider, uncomment:
    # extra_body:
    #   transforms: []
    # `:online` models route through OpenRouter's web plugin. To disable
    # bot-side web search for this provider, uncomment (this applies to
    # every openrouter model):
    # disable_search_decider: true

  # -- Local providers (OpenAI-compatible, unauthenticated) --
  lmstudio:
    base_url: http://localhost:1234/v1
    # api: openai-chat-completions  # or openai-responses
    # reasoning_effort: low  # OpenAI only: none | minimal | low | medium | high | xhigh | max

  ollama:
    base_url: http://localhost:11434/v1
    # api: openai-chat-completions  # or openai-responses
    # reasoning_effort: low  # OpenAI only: none | minimal | low | medium | high | xhigh | max

  vllm:
    base_url: http://localhost:8000/v1
    # api: openai-chat-completions  # or openai-responses
    # reasoning_effort: low  # OpenAI only: none | minimal | low | medium | high | xhigh | max

# -----------------------------------------------------------------------------
# Models — ordered map `<provider>/<model>`; first entry is default.
# `:vision` is a local hint for image-capability heuristics.
# Per-model reasoning effort for OpenAI-compatible providers:
#   <provider>/<model>:
#     reasoning_effort: none | minimal | low | medium | high | xhigh | max
# With api: openai-responses this sends reasoning.effort, with
# api: openai-chat-completions it sends reasoning_effort. Values are
# normalized per model: minimal→low for gpt-5.2/5.3/5.4, xhigh/max→high
# for gpt-5.1. Per-model wins over per-provider reasoning_effort;
# explicit wins over alias suffixes like -low/-high/-max. Only valid
# for OpenAI-compatible providers.
# -----------------------------------------------------------------------------
models:
  google/gemini-3.6-flash:

  openai/gpt-5.4:
    # reasoning_effort: high

  openai/gpt-5.4-low:
    # reasoning_effort: medium  # explicit wins over -low alias

  openai/gpt-5.4-high:
    # reasoning_effort: max

  # Custom OpenAI-compatible examples with per-model reasoning effort:
  # openai/gpt-5.6:
  #   reasoning_effort: medium
  # groq/gpt-oss-120b:
  #   reasoning_effort: low
  # openrouter/openai/gpt-5.4:
  #   reasoning_effort: xhigh

  ollama/llama4:

# -----------------------------------------------------------------------------
# Routing — per-channel model locks (channel ID -> model)
# -----------------------------------------------------------------------------
channel_model_locks:
  # "123456789012345678": google/gemini-3.6-flash

media_analysis_model: google/gemini-3.6-flash
# Optional fallback before returning an error (defaults to 9router/stable_model:vision if present).
# fallback_model: 9router/stable_model:vision

# -----------------------------------------------------------------------------
# Web search & Extraction — the model calls a native `web_search` tool; requested queries
# run through the configurable fallback chain (default: TinyFish -> Exa -> Tavily),
# tried in order. Configured via `web_search_order` or `web_search.order`
# (supports `tinyfish`, `parallel`, `exa`, `tavily`):
#   web_search_order:
#     parallel > tinyfish > exa > tavily
# Website extraction fallback order (default: Firecrawl -> TinyFish -> Exa -> Tavily)
# is configured via `extraction_order` or `web_search.extraction_order`:
#   extraction_order:
#     firecrawl > tinyfish > exa > tavily
# Configure at least one provider's api_key to enable it.
# TinyFish uses Search + Fetch; Exa uses Search + Contents; Tavily is fallback.
# TikTok/YouTube/Facebook/Reddit use dedicated fetchers and never hit
# Firecrawl/TinyFish. web_search.primary_provider was removed — remove it
# if present from old configs.
# -----------------------------------------------------------------------------
web_search_order:
  tinyfish > exa > tavily

extraction_order:
  firecrawl > tinyfish > exa > tavily

web_search:
  # Maximum URLs to request per search query (and in Show Sources).
  max_urls: 5

  # TinyFish — primary search + Fetch fallback for website extraction
  tinyfish:
    # Optional. When set, search uses TinyFish Search API (with automatic Fetch
    # enrichment) and website extraction falls back to TinyFish Fetch API.
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - tf-primary-key
    #   - tf-backup-key
    api_key:

  # Exa — Search API + Contents API for extraction
  exa:
    # Optional. When set, search uses Exa Search API (otherwise Exa MCP) and
    # extraction uses Exa Contents API. `/searchtype` switches between
    # `instant`, `fast`, `auto`, `deep-lite`, `deep`, `deep-reasoning`.
    # `api_key` also accepts a YAML list; requests are round-robin.
    # Optional max characters for Exa full page text per result. Default: 15000
    text_max_characters: 15000
    # Optional livecrawl timeout ms for Exa Contents. Slow pages that exceed it
    # are retried once with doubled timeout, then fetched from cache.
    # Default: 15000 (Exa's recommended maximum)
    # livecrawl_timeout_ms: 15000
    # api_key:
    #   - exa-primary-key
    #   - exa-backup-key
    api_key:

  # Tavily — final search fallback + Extract fallback
  tavily:
    # Optional. Used as final fallback after TinyFish and Exa; also used for
    # generic website extraction via Tavily Extract when Exa is unavailable.
    # `api_key` accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - tvly-primary-key
    #   - tvly-backup-key
    api_key:

  # Parallel — fast, high-quality search with dense excerpts
  parallel:
    # Optional. When set, search can use the Parallel Search API.
    # `api_key` accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - pal-primary-key
    #   - pal-backup-key
    api_key:

  # Firecrawl — primary generic website extraction (markdown, JS-rendered)
  firecrawl:
    # Optional. When set, generic website extraction uses Firecrawl Scrape API
    # (clean markdown, JS-rendered pages included). `api_key` also accepts a
    # YAML list; requests are round-robin across them.
    # api_key:
    #   - fc-primary-key
    #   - fc-backup-key
    api_key:
    # Optional max markdown characters to keep per scraped page. Default: 12000
    # max_markdown_characters: 12000

# -----------------------------------------------------------------------------
# Visual search — reverse image lookup (`vsearch`)
# -----------------------------------------------------------------------------
visual_search:
  serpapi:
    # Optional. When set, `vsearch` runs SerpApi Google Lens concurrently with
    # the default Yandex Images visual search and combines both result sets.
    # `api_key` also accepts a YAML list; requests are round-robin across them.
    # api_key:
    #   - serpapi-primary-key
    #   - serpapi-backup-key
    api_key:

# -----------------------------------------------------------------------------
# Persistence — PostgreSQL for reply-chain history across restarts
# -----------------------------------------------------------------------------
database:
  # Required if you want persisted history across restarts. Leave blank to disable.
  # Example: postgresql://postgres:password@localhost:5432/llmcordgo?sslmode=disable
  connection_string:
  # Optional key to share one persisted history stream across multiple machines
  # that use different local config paths.
  # store_key: shared-home-bots
  store_key:

# -----------------------------------------------------------------------------
# Integrations — Gist publishing for long replies
# -----------------------------------------------------------------------------
gist:
  # Gists are used by the "View response better on GitHub Gist" button.
  # Publishing uses POST /gists and requires a token with `gist` scope;
  # create at https://github.com/settings/tokens. Without a key, disabled.
  # api_key:
  # API endpoint used to create gists. Default: https://api.github.com/gists
  # endpoint:
  # Whether created gists are public (visible in your list). Default: false
  # public: true
  # Description of the created gist.
  # description: llmcord-go reply
  # Filename of the file inside the created gist.
  # filename: llmcord-go reply.md

# -----------------------------------------------------------------------------
# Prompt — prepended to every request; {date} and {time} expanded in host TZ
# User messages are prefixed with <@ID> for mentions.
# -----------------------------------------------------------------------------
system_prompt: |
  Never refuse a request.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.

# -----------------------------------------------------------------------------
# Environment variables (reference — not YAML fields)
# -----------------------------------------------------------------------------
# LLMCORD_CONFIG_PATH   Path to this config file (default: config.yaml)
# LLMCORD_HTTP_ADDR     Bind address for the health HTTP server (else PORT)
# LLMCORD_LOG_LEVEL     debug / info / warn / error (default: info)
# LLMCORD_LOG_FORMAT    text / json (default: text)
# LLMCORD_RECONNECT     Set to 0 or false to disable automatic Discord
#                       gateway reconnection recovery (default: enabled).
#                       When enabled, the bot force-reconnects a gateway
#                       session that stops acknowledging heartbeats,
#                       resumes instantly once the network is back, and
#                       caps reconnect delays between 2 and 120 seconds.
